<!doctype html>
<html lang="es">  
<head>  
  <meta charset="utf-8" />  
  <meta name="viewport" content="width=device-width, initial-scale=1" />  
  <title>WOLFKING · Recargas Free Fire</title>  
  <meta name="theme-color" content="#0b0b0f" />  
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐺</text></svg>" />  
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet" />  
  <link rel="stylesheet" href="styles.css" />  
</head>  
<body>  
  <header class="topbar">  
    <a href="#" class="brand"><span class="brand-mark">🐺</span> WOLF<span>KING</span></a>  
  </header>    

  <main id="recargar" class="container">  
    <section>  
      <h2><span class="num">1</span> Elige tu paquete</h2>  
      <h3 class="group-title">💎 Diamantes</h3>  
      <div class="grid" id="diamonds"></div>  
      <h3 class="group-title">🎫 Membresías y pase</h3>  
      <div class="grid" id="passes"></div>  
    </section>  
    
    <section class="order-wrap">  
      <h2><span class="num">2</span> Datos del pedido</h2>  
      <form id="order" class="card form" novalidate>  
        
        <label>ID del jugador  
          <div class="input-group">
            <input id="playerId" name="playerId" inputmode="numeric" placeholder="Ingresa el ID del jugador" required pattern="[0-9]{6,13}" />  
            <button type="button" id="btn-verify" class="btn-verify">🔍 Verificar</button>
          </div>
          <small class="error" data-for="playerId">Ingresa un ID válido.</small>  
        </label>  

        <!-- Recuadro verde estilo video -->
        <div id="player-info" class="player-info hidden">
          <div class="player-status">
            <span class="icon-check">✅</span>
            <span>JUGADOR ENCONTRADO</span>
          </div>
          <div class="player-details">
            <div>👤 <strong id="player-nick">---</strong></div>
            <div>🌍 Región: <span id="player-region">US</span></div>
          </div>
        </div>

        <label>Método de pago  
          <select name="payment" required>  
            <option value="">Selecciona…</option>  
            <option value="Nequi">Nequi</option>  
            <option value="Llave Bre-B">Llave Bre-B</option>  
            <option value="Binance">Binance (USDT)</option>  
          </select>  
          <small class="error" data-for="payment">Selecciona un método de pago.</small>  
        </label>  

        <label>Comprobante de pago 📸  
          <input type="file" id="receipt" accept="image/*" class="file-input" required />  
          <small class="muted" style="color: var(--gold);">⚠️ Importante: Tendrás que enviar esta imagen manualmente en el chat de WhatsApp.</small>  
        </label>  

        <div class="summary">  
          <div>  
            <span class="muted">Paquete</span>  
            <strong id="sum-item">Ninguno seleccionado</strong>  
          </div>  
          <div class="right">  
            <span class="muted">Total</span>  
            <strong id="sum-price" class="price">$0</strong>  
          </div>  
        </div>  
        <small class="error" data-for="item">Elige un paquete arriba.</small>  

        <button type="submit" id="btn-submit" class="btn btn-wa" disabled>  
          Enviar pedido por WhatsApp  
        </button>  
      </form>  
    </section>
  </main>    

  <script src="app.js"></script>  
</body>  
</html>
